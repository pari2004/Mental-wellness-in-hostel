version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: mental-wellness-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: mental_wellness_platform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - mental-wellness-network

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: mental-wellness-redis
    restart: unless-stopped
    command: redis-server --requirepass password123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mental-wellness-network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mental-wellness-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/mental_wellness_platform?authSource=admin
      REDIS_URL: redis://:password123@redis:6379
      JWT_SECRET: your-super-secret-jwt-key-development
      ENCRYPTION_KEY: development-encryption-key-32chars
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - mental-wellness-network
    command: npm run dev

  # Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mental-wellness-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mental-wellness-network
    command: npm start

  # AI Chatbot Service
  ai-chatbot:
    build:
      context: ./ai-chatbot
      dockerfile: Dockerfile
    container_name: mental-wellness-ai-chatbot
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/mental_wellness_platform?authSource=admin
    ports:
      - "5001:5001"
    volumes:
      - ./ai-chatbot:/app
    depends_on:
      - mongodb
    networks:
      - mental-wellness-network

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: mental-wellness-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mental-wellness-network
    profiles:
      - production

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  mental-wellness-network:
    driver: bridge
